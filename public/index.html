<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heaven's Door</title>
    <link rel="icon" type="image/webp" href="%PUBLIC_URL%/favicon.webp" />

    <!-- Open connections early to the servers every visit talks to. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" />

    <!-- Every web font the app uses, in one request and only at the weights
         used. Browsers download a font file only when text on screen needs it,
         so the login-page fonts cost nothing once signed in. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400&family=Montserrat:wght@400&family=Playfair+Display:wght@700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
